<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nyxon — Paper plugins, servers and sites</title>
    <meta
      name="description"
      content="Public Paper plugins: modernCore, modernCrates, modernArena, modernStore. Servers and sites on request."
    />
    <meta name="theme-color" content="#05060A" />
    <meta property="og:title" content="Nyxon — Paper plugins, servers and sites" />
    <meta
      property="og:description"
      content="modernCore, modernCrates, modernArena and modernStore. Servers and sites on request."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://nyxon-com.github.io/nyxon/" />
    <link rel="canonical" href="https://nyxon-com.github.io/nyxon/" />
    <script>
      (function () {
        var allowed = { it: 1, en: 1, es: 1, de: 1, fr: 1 };
        var q = new URLSearchParams(location.search).get("lang");
        var saved = "";
        try { saved = localStorage.getItem("nyxon.lang") || ""; } catch (e) {}
        var lang = allowed[q] ? q : allowed[saved] ? saved : "en";
        var titles = {
          it: "Nyxon — plugin Paper, server e siti",
          en: "Nyxon — Paper plugins, servers and sites",
          es: "Nyxon — plugins de Paper, servidores y sitios",
          de: "Nyxon — Paper-Plugins, Server und Seiten",
          fr: "Nyxon — plugins Paper, serveurs et sites"
        };
        document.documentElement.lang = lang;
        var path = location.pathname.replace(/\/$/, "");
        document.title = path.endsWith("/server")
          ? "Nyxon — Server made"
          : path.endsWith("/design")
            ? "Nyxon — Design"
            : titles[lang];
      })();
    </script>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
